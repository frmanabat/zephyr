description: |
  The MAX86178 is a highly integrated, multiple vital-sign monitoring device
  with a complete photoplethysmogram (PPG), electrocardiogram (ECG) and
  biopotential (BioZ) analog front end (AFE) for wearable applications.

  This binding supports configuration of:
  - Clock settings (oscillator, PPG, ECG, BioZ dividers)
  - PPG with up to 6 measurement slots
  - ECG with calibration, lead detection, and RLD
  - BioZ with calibration and lead detection
  - Respiration monitoring
compatible: "adi,max86178"

include: [sensor-device.yaml, spi-device.yaml]

properties:
  # =========================================================================
  # DEVICE CONFIGURATION PROPERTIES (properties of the max86178 node itself)
  # =========================================================================
  int1-gpios:
    type: phandle-array
    description: The INT1 signal defaults to active low as produced by the
      sensor.  The property value should ensure the flags properly
      describe the signal that is presented to the driver.
      Either this or INT2 will be used to route interrupts. If both
      are defined, then int1 is prioritized.
  
  int2-gpios:
    type: phandle-array
    description: The INT2 signal defaults to active low as produced by the
      sensor.  The property value should ensure the flags properly
      describe the signal that is presented to the driver.
      Either this or INT1 will be used to route interrupts. If both
      are defined, then int1 is prioritized.
################################################################################
#                              CLOCK CONFIGURATION                             #
################################################################################

child-binding:
  description: MAX86178 functional blocks (clk, fifo, ppg, ecg, bioz, resp)

  properties:
    # =========================================================================
    # PPG DIRECT PROPERTIES (properties of the ppg node itself)
    # =========================================================================
    meas1-en:
      type: boolean
      description: Enable PPG measurement slot 1

    meas2-en:
      type: boolean
      description: Enable PPG measurement slot 2

    meas3-en:
      type: boolean
      description: Enable PPG measurement slot 3

    meas4-en:
      type: boolean
      description: Enable PPG measurement slot 4

    meas5-en:
      type: boolean
      description: Enable PPG measurement slot 5

    meas6-en:
      type: boolean
      description: Enable PPG measurement slot 6

    ppg1-pwrdn:
      type: int
      description: PPG channel 1 power control
      enum:
        - 0 # MAX86178_PPG_CHAN_ENABLED - Channel enabled
        - 1 # MAX86178_PPG_CHAN_PWRDN - Channel powered down

    ppg2-pwrdn:
      type: int
      description: PPG channel 2 power control
      enum:
        - 0 # MAX86178_PPG_CHAN_ENABLED - Channel enabled
        - 1 # MAX86178_PPG_CHAN_PWRDN - Channel powered down

    ppg-sync-mode:
      type: int
      description: PPG synchronization mode
      enum:
        - 0 # MAX86178_PPG_INTERNAL_SYNC - Internal sync
        - 1 # MAX86178_PPG_EXTERNAL_SYNC - External sync via TRIG pin

    prox-data-en:
      type: boolean
      description: Enable proximity data output

    prox-auto-en:
      type: boolean
      description: Enable automatic proximity detection

    alc-disable:
      type: boolean
      description: Disable automatic light control (ALC)

    collect-raw-data:
      type: boolean
      description: Collect raw ADC data instead of processed
    
    pd1-bias:
      type: int
      description: Photodiode 1 bias setting
      enum:
        - 0 # MAX86178_PPG_PD_BIAS_NOT_RECOMMENDED
        - 1 # MAX86178_PPG_PD_BIAS_0_TO_125pF
        - 2 # MAX86178_PPG_PD_BIAS_125pF_TO_250pF
        - 3 # MAX86178_PPG_PD_BIAS_250pF_TO_500pF
    
    pd2-bias:
      type: int
      description: Photodiode 2 bias setting
      enum:
        - 0 # MAX86178_PPG_PD_BIAS_NOT_RECOMMENDED
        - 1 # MAX86178_PPG_PD_BIAS_0_TO_125pF
        - 2 # MAX86178_PPG_PD_BIAS_125pF_TO_250pF
        - 3 # MAX86178_PPG_PD_BIAS_250pF_TO_500pF
    
    pd3-bias:
      type: int
      description: Photodiode 3 bias setting
      enum:
        - 0 # MAX86178_PPG_PD_BIAS_NOT_RECOMMENDED
        - 1 # MAX86178_PPG_PD_BIAS_0_TO_125pF
        - 2 # MAX86178_PPG_PD_BIAS_125pF_TO_250pF
        - 3 # MAX86178_PPG_PD_BIAS_250pF_TO_500pF
    
    pd4-bias:
      type: int
      description: Photodiode 4 bias setting
      enum:
        - 0 # MAX86178_PPG_PD_BIAS_NOT_RECOMMENDED
        - 1 # MAX86178_PPG_PD_BIAS_0_TO_125pF
        - 2 # MAX86178_PPG_PD_BIAS_125pF_TO_250pF
        - 3 # MAX86178_PPG_PD_BIAS_250pF_TO_500pF

    meas1-config-sel:
      type: boolean
      description: Use MEAS1 configuration for all slots

    smp-ave:
      type: int
      description: Sample averaging
      enum:
        - 0 # MAX86178_SMP_AVE_1 - No averaging
        - 1 # MAX86178_SMP_AVE_2 - Average 2 samples
        - 2 # MAX86178_SMP_AVE_4 - Average 4 samples
        - 3 # MAX86178_SMP_AVE_8 - Average 8 samples
        - 4 # MAX86178_SMP_AVE_16 - Average 16 samples

    # =========================================================================
    # RESPIRATION DIRECT PROPERTIES (properties of the resp node itself)
    # =========================================================================
    resp-en:
      type: boolean
      description: Enable respiration monitoring

    cg-mode:
      type: int
      description: Carrier generation mode (2-bit value)

    cg-chop-clk:
      type: int
      description: Carrier generation chopper clock (2-bit value)

    cg-lpf-duty:
      type: int
      description: Carrier generation LPF duty cycle (3-bit value)

    # =========================================================================
    # FIFO DIRECT PROPERTIES (properties of the fifo node itself)
    # =========================================================================
    fifo-rollover-en:
      type: boolean
      description: Enable FIFO rollover
    
    fifo-a-full-type:
      type: boolean
      description: FIFO almost full interrupt type
    
    fifo-watermark:
      type: int
      description: FIFO watermark level (number of samples in FIFO to trigger interrupt)

  # =============================================================================
  # NESTED CHILD NODES - Configuration for second-level children
  # =============================================================================

  child-binding:
    description: Second-level configuration nodes (osc, ppg_clk, meas_1, thresh, setup, etc.)

    properties:
      # ---------------------------------------------------------------------------
      # Oscillator Configuration (in "osc" node)
      # ---------------------------------------------------------------------------
      ref-clk-sel:
        type: int
        description: Reference clock source selection
        enum:
          - 0 # MAX86178_REF_CLK_SEL_INTERNAL - Internal oscillator
          - 1 # MAX86178_REF_CLK_SEL_EXTERNAL - External clock via CLKIN pin

      clk-freq-sel:
        type: int
        description: Reference clock frequency selection
        enum:
          - 0 # MAX86178_REF_CLK_32000 - 32.000 kHz
          - 1 # MAX86178_REF_CLK_32768 - 32.768 kHz

      clk-fine-tune:
        type: int
        description: Clock fine-tuning adjustment (5-bit value, see datasheet for mapping)
        default: 0

      mdiv:
        type: int
        description: PLL M divider value
        default: 0

      # ---------------------------------------------------------------------------
      # PPG Clock Configuration (in "ppg_clk" node)
      # ---------------------------------------------------------------------------
      fr-clk-div:
        type: int
        description: PPG frame rate clock divider (15-bit value)
        default: 0

      # ---------------------------------------------------------------------------
      # ECG Clock Configuration (in "ecg_clk" node)
      # ---------------------------------------------------------------------------
      ecg-fdiv:
        type: int
        description: ECG F divider (3-bit value)
        default: 0

      ecg-ndiv:
        type: int
        description: ECG N divider (11-bit value)
        default: 0

      ecg-dec-rate:
        type: int
        description: ECG decimation rate
        enum:
          - 0 # MAX86178_ECG_DEC_RATE_16 - Decimation by 16
          - 1 # MAX86178_ECG_DEC_RATE_32 - Decimation by 32
          - 2 # MAX86178_ECG_DEC_RATE_64 - Decimation by 64
          - 3 # MAX86178_ECG_DEC_RATE_128 - Decimation by 128
          - 4 # MAX86178_ECG_DEC_RATE_256 - Decimation by 256
          - 5 # MAX86178_ECG_DEC_RATE_512 - Decimation by 512

      # ---------------------------------------------------------------------------
      # BioZ Clock Configuration (in "bioz_clk" node)
      # ---------------------------------------------------------------------------
      bioz-kdiv:
        type: int
        description: BioZ K divider
        enum:
          - 0  # MAX86178_BIOZ_KDIV_1
          - 1  # MAX86178_BIOZ_KDIV_2
          - 2  # MAX86178_BIOZ_KDIV_4
          - 3  # MAX86178_BIOZ_KDIV_8
          - 4  # MAX86178_BIOZ_KDIV_16
          - 5  # MAX86178_BIOZ_KDIV_32
          - 6  # MAX86178_BIOZ_KDIV_64
          - 7  # MAX86178_BIOZ_KDIV_128
          - 8  # MAX86178_BIOZ_KDIV_256
          - 9  # MAX86178_BIOZ_KDIV_512
          - 10 # MAX86178_BIOZ_KDIV_1024
          - 11 # MAX86178_BIOZ_KDIV_2048
          - 12 # MAX86178_BIOZ_KDIV_4096
          - 13 # MAX86178_BIOZ_KDIV_8192

      bioz-ndiv:
        type: int
        description: BioZ N divider
        enum:
          - 0 # MAX86178_BIOZ_NDIV_256
          - 1 # MAX86178_BIOZ_NDIV_512
          - 2 # MAX86178_BIOZ_NDIV_1024

      bioz-adc-osr:
        type: int
        description: BioZ ADC oversampling ratio
        enum:
          - 0 # MAX86178_BIOZ_ADC_OSR_8
          - 1 # MAX86178_BIOZ_ADC_OSR_16
          - 2 # MAX86178_BIOZ_ADC_OSR_32
          - 3 # MAX86178_BIOZ_ADC_OSR_64
          - 4 # MAX86178_BIOZ_ADC_OSR_128
          - 5 # MAX86178_BIOZ_ADC_OSR_256
          - 6 # MAX86178_BIOZ_ADC_OSR_512
          - 7 # MAX86178_BIOZ_ADC_OSR_1024

      bioz-dac-osr:
        type: int
        description: BioZ DAC oversampling ratio
        enum:
          - 0 # MAX86178_BIOZ_DAC_OSR_32
          - 1 # MAX86178_BIOZ_DAC_OSR_64
          - 2 # MAX86178_BIOZ_DAC_OSR_128
          - 3 # MAX86178_BIOZ_DAC_OSR_256

      # ---------------------------------------------------------------------------
      # PPG MEASUREMENT SLOT PROPERTIES (for meas_1 through meas_6 nodes)
      # ---------------------------------------------------------------------------
      # LED Driver Selection
      drva:
        type: int
        description: LED driver A selection
        enum:
          - 0 # MAX86178_PPG_DRVA_LED1_DRV - LED1
          - 1 # MAX86178_PPG_DRVA_LED2_DRV - LED2
          - 2 # MAX86178_PPG_DRVA_LED3_DRV - LED3
          - 3 # MAX86178_PPG_DRVA_LED4_DRV - LED4
          - 4 # MAX86178_PPG_DRVA_LED5_DRV - LED5
          - 5 # MAX86178_PPG_DRVA_LED6_DRV - LED6

      drvb:
        type: int
        description: LED driver B selection
        enum:
          - 0 # MAX86178_PPG_DRVB_LED1_DRV - LED1
          - 1 # MAX86178_PPG_DRVB_LED2_DRV - LED2
          - 2 # MAX86178_PPG_DRVB_LED3_DRV - LED3
          - 3 # MAX86178_PPG_DRVB_LED4_DRV - LED4
          - 4 # MAX86178_PPG_DRVB_LED5_DRV - LED5
          - 5 # MAX86178_PPG_DRVB_LED6_DRV - LED6

      drva-pa:
        type: int
        description: LED driver A current in PA (pulse amplitude)
        default: 0

      drvb-pa:
        type: int
        description: LED driver B current in PA (pulse amplitude)
        default: 0

      # Photodiode Selection
      pd1-sel:
        type: int
        description: Photodiode 1 connection
        enum:
          - 1 # MAX86178_PD_NOT_SEL - Not selected
          - 2 # MAX86178_PD_CONN_TO_PPG1 - Connected to PPG1 channel
          - 3 # MAX86178_PD_CONN_TO_PPG2 - Connected to PPG2 channel

      pd2-sel:
        type: int
        description: Photodiode 2 connection
        enum:
          - 1 # MAX86178_PD_NOT_SEL - Not selected
          - 2 # MAX86178_PD_CONN_TO_PPG1 - Connected to PPG1 channel
          - 3 # MAX86178_PD_CONN_TO_PPG2 - Connected to PPG2 channel

      pd3-sel:
        type: int
        description: Photodiode 3 connection
        enum:
          - 1 # MAX86178_PD_NOT_SEL - Not selected
          - 2 # MAX86178_PD_CONN_TO_PPG1 - Connected to PPG1 channel
          - 3 # MAX86178_PD_CONN_TO_PPG2 - Connected to PPG2 channel

      pd4-sel:
        type: int
        description: Photodiode 4 connection
        enum:
          - 1 # MAX86178_PD_NOT_SEL - Not selected
          - 2 # MAX86178_PD_CONN_TO_PPG1 - Connected to PPG1 channel
          - 3 # MAX86178_PD_CONN_TO_PPG2 - Connected to PPG2 channel

      # Ambient Mode
      amb-mode:
        type: int
        description: Ambient light measurement mode
        enum:
          - 0 # MAX86178_PPG_AMB_NORMAL_MODE - Normal PPG mode
          - 1 # MAX86178_PPG_AMB_DIRECT_AMB_CONV - Direct ambient light conversion

      # Averaging and Filtering
      avg-num:
        type: int
        description: Number of ADC samples to average per exposure
        enum:
          - 0 # MAX86178_PPG_AVG_NUM_1
          - 1 # MAX86178_PPG_AVG_NUM_2
          - 2 # MAX86178_PPG_AVG_NUM_4
          - 3 # MAX86178_PPG_AVG_NUM_8
          - 4 # MAX86178_PPG_AVG_NUM_16
          - 5 # MAX86178_PPG_AVG_NUM_32
          - 6 # MAX86178_PPG_AVG_NUM_64
          - 7 # MAX86178_PPG_AVG_NUM_128

      sinc3-sel:
        type: int
        description: SINC3 filter enable
        enum:
          - 0 # MAX86178_PPG_SINC3_OFF
          - 1 # MAX86178_PPG_SINC3_ON

      filt-sel:
        type: int
        description: Ambient cancellation filter selection
        enum:
          - 0 # MAX86178_PPG_FILT_SEL_CDM - Coded division multiplexing
          - 1 # MAX86178_PPG_FILT_SEL_FDM - Frequency division multiplexing

      filt2-sel:
        type: int
        description: Second filter order selection
        enum:
          - 0 # MAX86178_PPG_FILT2_3RD_ORDER
          - 1 # MAX86178_PPG_FILT2_2ND_ORDER

      # ADC Configuration
      ppg1-adc-rge:
        type: int
        description: PPG1 ADC range
        enum:
          - 0 # MAX86178_PPG_ADC_RGE_4uA - 4µA full scale
          - 1 # MAX86178_PPG_ADC_RGE_8uA - 8µA full scale
          - 2 # MAX86178_PPG_ADC_RGE_16uA - 16µA full scale
          - 3 # MAX86178_PPG_ADC_RGE_32uA - 32µA full scale

      ppg2-adc-rge:
        type: int
        description: PPG2 ADC range
        enum:
          - 0 # MAX86178_PPG_ADC_RGE_4uA - 4µA full scale
          - 1 # MAX86178_PPG_ADC_RGE_8uA - 8µA full scale
          - 2 # MAX86178_PPG_ADC_RGE_16uA - 16µA full scale
          - 3 # MAX86178_PPG_ADC_RGE_32uA - 32µA full scale

      ppg1-dac-off:
        type: int
        description: PPG1 DAC offset current
        enum:
          - 0  # MAX86178_PPG_DAC_OFF_0uA
          - 1  # MAX86178_PPG_DAC_OFF_2uA
          - 2  # MAX86178_PPG_DAC_OFF_4uA
          - 3  # MAX86178_PPG_DAC_OFF_6uA
          - 4  # MAX86178_PPG_DAC_OFF_8uA
          - 5  # MAX86178_PPG_DAC_OFF_10uA
          - 6  # MAX86178_PPG_DAC_OFF_12uA
          - 7  # MAX86178_PPG_DAC_OFF_14uA
          - 8  # MAX86178_PPG_DAC_OFF_16uA
          - 9  # MAX86178_PPG_DAC_OFF_18uA
          - 10 # MAX86178_PPG_DAC_OFF_20uA
          - 11 # MAX86178_PPG_DAC_OFF_22uA
          - 12 # MAX86178_PPG_DAC_OFF_24uA
          - 13 # MAX86178_PPG_DAC_OFF_26uA
          - 14 # MAX86178_PPG_DAC_OFF_28uA
          - 15 # MAX86178_PPG_DAC_OFF_30uA

      ppg2-dac-off:
        type: int
        description: PPG2 DAC offset current
        enum:
          - 0  # MAX86178_PPG_DAC_OFF_0uA
          - 1  # MAX86178_PPG_DAC_OFF_2uA
          - 2  # MAX86178_PPG_DAC_OFF_4uA
          - 3  # MAX86178_PPG_DAC_OFF_6uA
          - 4  # MAX86178_PPG_DAC_OFF_8uA
          - 5  # MAX86178_PPG_DAC_OFF_10uA
          - 6  # MAX86178_PPG_DAC_OFF_12uA
          - 7  # MAX86178_PPG_DAC_OFF_14uA
          - 8  # MAX86178_PPG_DAC_OFF_16uA
          - 9  # MAX86178_PPG_DAC_OFF_18uA
          - 10 # MAX86178_PPG_DAC_OFF_20uA
          - 11 # MAX86178_PPG_DAC_OFF_22uA
          - 12 # MAX86178_PPG_DAC_OFF_24uA
          - 13 # MAX86178_PPG_DAC_OFF_26uA
          - 14 # MAX86178_PPG_DAC_OFF_28uA
          - 15 # MAX86178_PPG_DAC_OFF_30uA

      # Timing Configuration
      tint:
        type: int
        description: LED integration time
        enum:
          - 0 # MAX86178_PPG_TINT_14_6us - 14.6 µs
          - 1 # MAX86178_PPG_TINT_29_2us - 29.2 µs
          - 2 # MAX86178_PPG_TINT_58_6us - 58.6 µs
          - 3 # MAX86178_PPG_TINT_117_0us - 117.0 µs

      pd-setlng:
        type: int
        description: Photodiode settling time
        enum:
          - 0 # MAX86178_PPG_PD_SETLNG_7_8us - 7.8 µs
          - 1 # MAX86178_PPG_PD_SETLNG_11_8us - 11.8 µs
          - 2 # MAX86178_PPG_PD_SETLNG_15_8us - 15.8 µs
          - 3 # MAX86178_PPG_PD_SETLNG_23_8us - 23.8 µs

      led-setlng:
        type: int
        description: LED settling time
        enum:
          - 0 # MAX86178_PPG_LED_SETLNG_7_7us - 7.7 µs
          - 1 # MAX86178_PPG_LED_SETLNG_11_7us - 11.7 µs
          - 2 # MAX86178_PPG_LED_SETLNG_15_7us - 15.7 µs
          - 3 # MAX86178_PPG_LED_SETLNG_23_7us - 23.7 µs

      # LED Range
      led-rge:
        type: int
        description: LED current range
        enum:
          - 0 # MAX86178_PPG_LED_RGE_32mA - 32 mA max
          - 1 # MAX86178_PPG_LED_RGE_64mA - 64 mA max
          - 2 # MAX86178_PPG_LED_RGE_96mA - 96 mA max
          - 3 # MAX86178_PPG_LED_RGE_128mA - 128 mA max

      # ---------------------------------------------------------------------------
      # Properties for thresh node
      # ---------------------------------------------------------------------------
      thresh1-meas-sel:
        type: int
        description: Threshold 1 measurement slot selection
        enum:
          - 0 # MAX86178_PPG_THRESH_DISABLED
          - 1 # MAX86178_PPG_THRESH_MEAS1
          - 2 # MAX86178_PPG_THRESH_MEAS2
          - 3 # MAX86178_PPG_THRESH_MEAS3
          - 4 # MAX86178_PPG_THRESH_MEAS4
          - 5 # MAX86178_PPG_THRESH_MEAS5
          - 6 # MAX86178_PPG_THRESH_MEAS6

      thresh2-meas-sel:
        type: int
        description: Threshold 2 measurement slot selection
        enum:
          - 0 # MAX86178_PPG_THRESH_DISABLED
          - 1 # MAX86178_PPG_THRESH_MEAS1
          - 2 # MAX86178_PPG_THRESH_MEAS2
          - 3 # MAX86178_PPG_THRESH_MEAS3
          - 4 # MAX86178_PPG_THRESH_MEAS4
          - 5 # MAX86178_PPG_THRESH_MEAS5
          - 6 # MAX86178_PPG_THRESH_MEAS6

      thresh1-chan-sel:
        type: int
        description: Threshold 1 PPG channel selection
        enum:
          - 0 # MAX86178_PPG_THRESH_PPG_CHAN1
          - 1 # MAX86178_PPG_THRESH_PPG_CHAN2

      thresh2-chan-sel:
        type: int
        description: Threshold 2 PPG channel selection
        enum:
          - 0 # MAX86178_PPG_THRESH_PPG_CHAN1
          - 1 # MAX86178_PPG_THRESH_PPG_CHAN2

      time-hyst:
        type: int
        description: Time-based hysteresis
        enum:
          - 0 # MAX86178_PPG_TIME_HYST_DISABLED
          - 1 # MAX86178_PPG_TIME_HYST_2_SAMPLES
          - 2 # MAX86178_PPG_TIME_HYST_4_SAMPLES
          - 3 # MAX86178_PPG_TIME_HYST_8_SAMPLES

      level-hyst:
        type: int
        description: Level-based hysteresis
        enum:
          - 0 # MAX86178_PPG_LEVEL_HYST_DISABLED
          - 1 # MAX86178_PPG_LEVEL_HYST_2_SAMPLES
          - 2 # MAX86178_PPG_LEVEL_HYST_4_SAMPLES
          - 3 # MAX86178_PPG_LEVEL_HYST_8_SAMPLES
          - 4 # MAX86178_PPG_LEVEL_HYST_16_SAMPLES
          - 5 # MAX86178_PPG_LEVEL_HYST_32_SAMPLES
          - 6 # MAX86178_PPG_LEVEL_HYST_64_SAMPLES
          - 7 # MAX86178_PPG_LEVEL_HYST_128_SAMPLES

      thresh1-hi:
        type: int
        description: Threshold 1 high limit (16-bit value)

      thresh1-lo:
        type: int
        description: Threshold 1 low limit (16-bit value)

      thresh2-hi:
        type: int
        description: Threshold 2 high limit (16-bit value)

      thresh2-lo:
        type: int
        description: Threshold 2 low limit (16-bit value)

################################################################################
#                              ECG CONFIGURATION                               #
################################################################################

  # =============================================================================
  # ECG BLOCK - Electrocardiogram configuration
  # =============================================================================

      # ---------------------------------------------------------------------------
      # ECG Child Nodes: setup, calibration, lead_detect, lead_bias, rld
      # All properties merged here since child-binding must be singular
      # ---------------------------------------------------------------------------

      # ---------------------------------------------------------------------------
      # Properties for setup node
      # ---------------------------------------------------------------------------
      ecg-en:
        type: boolean
        description: Enable ECG channel

      ecg-input-pol:
        type: int
        description: ECG input polarity
        enum:
          - 0 # MAX86178_ECG_INPUT_POL_NORMAL
          - 1 # MAX86178_ECG_INPUT_POL_INVERTED

      ecg-pga-gain:
        type: int
        description: ECG programmable gain amplifier gain
        enum:
          - 0 # MAX86178_ECG_PGA_GAIN_1 - Gain of 1
          - 1 # MAX86178_ECG_PGA_GAIN_2 - Gain of 2
          - 2 # MAX86178_ECG_PGA_GAIN_4 - Gain of 4
          - 3 # MAX86178_ECG_PGA_GAIN_8 - Gain of 8

      ecg-ina-rge:
        type: int
        description: ECG INA range (2-bit value)

      ecg-ina-gain:
        type: int
        description: ECG INA gain (3-bit value)

      ecg-imp-hi:
        type: boolean
        description: High impedance mode enable

      ecg-auto-rec:
        type: int
        description: ECG auto recovery mode
        enum:
          - 0 # MAX86178_ECG_AUTO_REC_DISABLED
          - 1 # MAX86178_ECG_AUTO_REC_ENABLED

      ecg-mux-sel:
        type: int
        description: ECG input mux selection (2-bit value)

      en-ecg-fast-rec:
        type: int
        description: ECG fast recovery mode
        enum:
          - 0 # MAX86178_EN_ECG_FAST_REC_NORMAL_MODE
          - 1 # MAX86178_EN_ECG_FAST_REC_MANUAL_FAST_REC_MODE
          - 2 # MAX86178_EN_ECG_FAST_REC_AUTO_FAST_REC_MODE

      ecg-fast-rec-thres:
        type: int
        description: ECG fast recovery threshold (6-bit value)

      # ---------------------------------------------------------------------------
        # Properties for calibration node
      # ---------------------------------------------------------------------------
      ecg-cal-high:
        type: int
        description: Calibration signal high time (11-bit value)

      ecg-cal-freq:
        type: int
        description: Calibration frequency divider
        enum:
          - 0 # MAX86178_ECG_CAL_FREQ_DIV_128
          - 1 # MAX86178_ECG_CAL_FREQ_DIV_512
          - 2 # MAX86178_ECG_CAL_FREQ_DIV_2048
          - 3 # MAX86178_ECG_CAL_FREQ_DIV_8192
          - 4 # MAX86178_ECG_CAL_FREQ_DIV_32768
          - 5 # MAX86178_ECG_CAL_FREQ_DIV_131072
          - 6 # MAX86178_ECG_CAL_FREQ_DIV_524288
          - 7 # MAX86178_ECG_CAL_FREQ_DIV_2097152

